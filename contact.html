<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Hunter Web Cafe</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-row">
  <div class="logo">Hunter Web Cafe</div>
      <button id="nav-toggle-4" class="nav-toggle" aria-label="Toggle navigation">☰</button>
      <nav id="main-nav-4" class="main-nav">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container contact-page">
    <h1>Contact Us</h1>
    <div class="contact-grid">
      <div class="map">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3021.915271021061!2d-74.0060150845936!3d40.71277577933092!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c25a3163f6f8c7%3A0x7e0f8a0d0b0e6d87!2sManhattan%2C%20New%20York%2C%20NY!5e0!3m2!1sen!2sus!4v1600000000000!5m2!1sen!2sus"
          width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
      </div>

      <form id="contact-form" class="contact-form">
        <label for="name">Name</label>
        <input id="name" name="name" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="btn">Send Message</button>
        <div id="form-result" aria-live="polite"></div>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <h4>Hunter Web Cafe</h4>
        <p>123 Coffee Lane, Manhattan, New York, NY</p>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
