name: Build and Publish to GitHub Pages (gh-pages branch)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-push-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build (set VITE_BASE_URL for repo subpath)
        run: |
          VITE_BASE_URL=/hawk-homework/ VITE_API_URL=https://hawk-homework.onrender.com/api npm run build

      - name: Publish to gh-pages
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: publish to gh-pages from main (${GITHUB_SHA})" || true
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"
          # Force-push to gh-pages
          git push -f origin gh-pages


